number: 10
slug: sandboxes
title: "Sandboxes · isolation · remote exec"
question: "where does agent-generated code run without wrecking your machine?"
golden_rule: >-
  match isolation strength to trust. Untrusted agent code → a real boundary (microVM:
  Firecracker/E2B/Daytona/microsandbox) beats a container (gVisor beats plain Docker; plain
  Docker is weakest). Hosted sandboxes are fastest to adopt but see your code/data (review
  data policies); local/self-hosted keeps it on your infra. This is the enforcement under
  §1's approval modes — a sandbox contains what an agent is allowed to attempt.
status: complete
