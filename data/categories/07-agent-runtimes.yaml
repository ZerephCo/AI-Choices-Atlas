number: 7
slug: agent-runtimes
title: "Agent runtimes / frameworks"
question: "what do you build a durable agent on? — the libraries/runtimes that give you state, control flow, multi-agent patterns, tools, and memory (distinct from §1 coding hosts, which are agents; these are what you build your own on)"
golden_rule: >-
  pick by control level + state model, not star count. Graph runtimes (LangGraph/ADK) give
  explicit, durable control (more code, more power). Crew/conversation frameworks
  (CrewAI/AutoGen/Agents SDK) trade control for speed-to-prototype. Type-safe/full-stack
  (PydanticAI/Agno) optimize production ergonomics. Watch lifecycle: AutoGen is in maintenance
  mode (→ Microsoft Agent Framework). These are libraries you host — review each as a
  dependency (license, telemetry).
status: complete
