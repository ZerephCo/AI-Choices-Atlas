number: 11
slug: qa-eval
title: "QA · evaluation · observability"
question: "is the agent actually any good, and what did it do?"
golden_rule: >-
  Separate offline eval (does it pass on a dataset before shipping — promptfoo/DeepEval)
  from online observability (what happened in production — Langfuse/Phoenix). You need both.
  Watch licenses here: several are source-available/enterprise-split (Langfuse EE, Phoenix
  Elastic License) — fine to use, but not OSI-permissive. promptfoo's red-teaming cross-links
  §15 Security; Playwright doubles as an agent tool (browser control).
