number: 13
slug: process-packs
title: "Process · spec · skill packs"
question: "what disciplined workflow do you drop on top of an agent?"
golden_rule: >-
  Process packs constrain how, not what runs — they're prompts/skills/specs layered on a
  coding host (§1) or loop (§5), not runtimes themselves. Spec-driven (Spec Kit/OpenSpec)
  front-loads alignment; skills (Superpowers/anthropics-skills) add reusable capability with
  progressive disclosure. Multi-agent workflow frameworks (MBA) wrap a task database (§3
  Beads) with a three-responsibility discipline and a user-authority gate. Star counts here
  are exceptionally high — treat them as popularity, not a quality verdict (the atlas rates
  attributes, not winners).
