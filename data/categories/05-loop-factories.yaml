number: 5
slug: loop-factories
title: "Loop factories"
question: "how do you make an agent keep going until the job is actually done? — the keep-going-until-done runners built on the Ralph Wiggum technique"
golden_rule: >-
  A loop factory is only as safe as its stop condition + guardrails. A pure Ralph loop
  ("a dumb bash loop that keeps restarting the agent") has no brakes — it runs until a
  completion token, an iteration cap, or your budget runs out. Governed loop harnesses
  (caps + verifier gates + rollback) live in §2 Orchestrators (MartinLoop =
  "Ralph-with-brakes", Loki Mode). §5 is the raw technique + runners; pair it with a
  proof-gate for production.
status: complete
