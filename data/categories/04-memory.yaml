number: 4
slug: memory
title: "Memory"
question: "what should an agent remember, and who owns that memory?"
golden_rule: >-
  Memory is suggestive, never canonical. It may surface context but must never close a task
  or certify readiness. Required controls for any writable memory: provenance, writer ACL,
  TTL/invalidation, delete/export, PII policy, tenant isolation, poisoning tests.
status: complete
