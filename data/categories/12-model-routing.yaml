title: "Model routing / gateways"
question: "how do agents reach many models cheaply and reliably?"
golden_rule: >-
  Separate unification (one API over many providers — LiteLLM/OpenRouter/Portkey) from
  routing (which model per request — RouteLLM/claude-code-router). They compose: e.g.
  claude-code-router → OpenRouter → many providers. Watch data flow: hosted gateways see
  your prompts (review data policies); self-hosted keeps them in your infra.
