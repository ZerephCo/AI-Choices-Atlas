number: 15
slug: security-ci
title: "Security & CI hard gates"
question: "what stops bad code from merging, no matter what the agent says?"
golden_rule: >-
  These must be hard gates the agent cannot override — wire them into required CI checks +
  branch protection, not into the agent's own toolbelt (where it could skip them). They catch
  what AI-generated code slips in: vulns (Semgrep/OSV/Trivy), secrets (Gitleaks), and
  disallowed actions (OPA). Overlap is fine and healthy — defense in depth.
status: complete
